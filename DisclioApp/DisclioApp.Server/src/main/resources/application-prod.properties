spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.auth.jwt-secret=${APP_AUTH_JWT_SECRET}
app.auth.access-token-minutes=${APP_AUTH_ACCESS_TOKEN_MINUTES:30}
app.auth.inactivity-timeout-minutes=${APP_AUTH_INACTIVITY_TIMEOUT_MINUTES:15}
app.auth.password-reset-token-minutes=${APP_AUTH_PASSWORD_RESET_TOKEN_MINUTES:15}
app.auth.email-login-code-minutes=${APP_AUTH_EMAIL_LOGIN_CODE_MINUTES:10}
app.auth.secure-cookies=${APP_AUTH_SECURE_COOKIES:true}
app.auth.same-site=${APP_AUTH_SAME_SITE:None}

spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
app.mail.from=${APP_MAIL_FROM:${SPRING_MAIL_USERNAME}}

server.port=${PORT:8080}
server.address=0.0.0.0
server.ssl.enabled=false
server.forward-headers-strategy=framework
